<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Edit User - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Prompt', sans-serif; background-color: #f4f7f6; }
        .edit-card { border: none; border-radius: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.08); background: white; }
    </style>
</head>
<body class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="edit-card p-5 mt-3">
                <div class="text-center mb-4">
                    <h3 class="fw-bold text-primary"><i class="fa-solid fa-user-pen me-2"></i>แก้ไขบัญชีผู้ใช้</h3>
                </div>
                
                <form action="/admin/user/edit/{{.User.ID}}" method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-bold">ชื่อผู้ใช้ (Username)</label>
                        <input type="text" name="username" class="form-control" value="{{.User.Username}}" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold">ระดับสิทธิ์ (Role)</label>
                        <select name="role" class="form-select">
                            <option value="user" {{if eq .User.Role "user"}}selected{{end}}>User (จัดการร้านกล้อง)</option>
                            <option value="admin" {{if eq .User.Role "admin"}}selected{{end}}>Admin (จัดการระบบ)</option>
                        </select>
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label fw-bold">ตั้งรหัสผ่านใหม่ <span class="text-danger small">(หากไม่ต้องการเปลี่ยน ให้ปล่อยว่างไว้)</span></label>
                        <input type="password" name="password" class="form-control" placeholder="••••••••">
                    </div>
                    
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success flex-grow-1 rounded-pill fw-bold">บันทึกการแก้ไข</button>
                        <a href="/admin/" class="btn btn-secondary rounded-pill px-4 fw-bold">ยกเลิก</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
