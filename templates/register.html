<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Register - Camera Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Prompt', sans-serif; background: linear-gradient(135deg, #2b5876 0%, #4e4376 100%); height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; }
        .auth-card { background: white; border-radius: 20px; box-shadow: 0 15px 30px rgba(0,0,0,0.2); padding: 3rem 2.5rem; width: 100%; max-width: 420px; }
        .btn-custom { border-radius: 50px; padding: 0.75rem; font-weight: 600; }
        .form-control { border-radius: 0 10px 10px 0; padding: 0.75rem 1rem; }
        .input-group-text { border-radius: 10px 0 0 10px; background-color: #f8f9fa; border-right: none; }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="text-center mb-4">
            <div class="bg-light rounded-circle d-inline-block p-3 mb-3 shadow-sm">
                <i class="fa-solid fa-user-plus" style="font-size: 2.5rem; color: #4e4376;"></i>
            </div>
            <h3 class="fw-bold">สมัครสมาชิก</h3>
            <p class="text-muted">เข้าร่วมเป็นลูกค้าร้านกล้องของเรา</p>
        </div>
        {{if .Error}}<div class="alert alert-danger rounded-3 text-center small py-2">{{.Error}}</div>{{end}}
        <form action="/register" method="POST">
            <div class="mb-3">
                <label class="form-label fw-bold small text-secondary">ตั้งชื่อผู้ใช้งาน</label>
                <div class="input-group shadow-sm">
                    <span class="input-group-text"><i class="fa-solid fa-id-badge text-muted"></i></span>
                    <input type="text" name="username" class="form-control border-start-0" required>
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label fw-bold small text-secondary">ตั้งรหัสผ่าน</label>
                <div class="input-group shadow-sm">
                    <span class="input-group-text"><i class="fa-solid fa-key text-muted"></i></span>
                    <input type="password" name="password" class="form-control border-start-0" required>
                </div>
            </div>
            <button type="submit" class="btn btn-success w-100 btn-custom mb-3 shadow">สมัครสมาชิก</button>
        </form>
        <div class="text-center mt-3 pt-3 border-top">
            <span class="text-muted small">มีบัญชีอยู่แล้ว? </span>
            <a href="/login" class="text-decoration-none fw-bold" style="color: #2b5876;">เข้าสู่ระบบเลย</a>
        </div>
    </div>
</body>
</html>
