<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Edit Order Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style> body { font-family: 'Prompt', sans-serif; background-color: #f4f7f6; } </style>
</head>
<body class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card p-5 shadow-sm border-0" style="border-radius: 15px;">
                <h4 class="fw-bold text-primary mb-3">✏️ แก้ไขที่อยู่จัดส่ง #{{.Order.ID}}</h4>
                <p class="text-muted mb-4">สินค้า: <strong>{{.Order.Product.Title}}</strong></p>
                <form action="/order/edit/{{.Order.ID}}" method="POST">
                    <div class="mb-4">
                        <label class="form-label fw-bold small text-secondary">ที่อยู่จัดส่ง</label>
                        <textarea name="remark" class="form-control" rows="4" required>{{.Order.Remark}}</textarea>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success flex-grow-1 fw-bold rounded-pill">บันทึก</button>
                        <a href="/" class="btn btn-secondary px-4 fw-bold rounded-pill">ยกเลิก</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
